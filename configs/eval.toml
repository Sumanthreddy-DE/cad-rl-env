# Eval: pure pass@1 (partial stays at weight 0). Model and client are set per run.
[env.taskset]
id = "text-to-cad-rl"
split = "eval"

[env.agent]
max_turns = 1

[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "subprocess"

[sampling]
max_tokens = 16384  # matches SimReady bench_v1; 4096 truncated reasoning models (smoke 2026-11-19)

[project]
name = "text-to-cad-rl"
version = "0.1.2"
description = "RL environment for text-to-CAD: models write a part as a JSON CAD program, graded on real OpenCASCADE B-rep geometry (dimensions, holes, features). verifiers v1, Prime Intellect Hub."
tags = ["single-turn", "v1", "eval", "train", "3d", "cad", "verifiable", "rl-environment", "engineering"]
keywords = ["reinforcement-learning", "rl-environment", "text-to-cad", "cad", "llm-evaluation", "verifiers", "opencascade", "brep", "mechanical-engineering"]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "verifiers>=0.4.1",
    "pydantic>=2",
    "simready[bench] @ git+https://github.com/Sumanthreddy-DE/simready@v0.5.1",
]

[project.urls]
Repository = "https://github.com/Sumanthreddy-DE/text-to-cad-rl"
Hub = "https://app.primeintellect.ai/dashboard/environments/sumanth/text-to-cad-rl"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["text_to_cad_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: bulk generator checks (minutes)"]
